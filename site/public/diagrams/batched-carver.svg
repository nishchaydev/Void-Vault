  <text x="75" y="475" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11.5">• <tspan fill="#38BDF8" font-weight="600">Throughput:</tspan> Sustained 1,248 MB/s on Samsung 990 Pro NVMe PCIe 4.0 (saturation of storage controller limits).</text>
  <text x="75" y="495" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11.5">• <tspan fill="#34D399" font-weight="600">RAM Zero-Skip:</tspan> Evaluates memory blocks at 28.5 GB/s using SIMD operations, skipping purged drives in &lt; 1 second.</text>
  <text x="75" y="515" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11.5">• <tspan fill="#FBBF24" font-weight="600">Adversarial Rigor:</tspan> Proves that even with advanced BGC reassembly, Void Vault's Smart Wipe leaves 0 recoverable bytes.</text>
