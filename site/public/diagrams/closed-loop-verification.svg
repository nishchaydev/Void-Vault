    <text x="20" y="70" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Hardware &amp; Sector Wipe</text>
    <text x="20" y="95" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• 17 Sanitization Standards</text>
    <text x="20" y="115" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• NIST SP 800-88 Rev 1 Purge</text>
    <text x="20" y="135" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• DoD 5220.22-M 7-Pass</text>
    <text x="20" y="155" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• NVMe Hardware Crypto Erase</text>
    <text x="20" y="175" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Smart Secure Wipe™ (67 sec)</text>
    <text x="20" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• DSM TRIM Allocation Purge</text>

