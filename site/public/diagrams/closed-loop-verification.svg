    <text x="20" y="175" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Raw Slack &amp; Unallocated Scan</text>
    <text x="20" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• AST Image Structure Validator</text>

