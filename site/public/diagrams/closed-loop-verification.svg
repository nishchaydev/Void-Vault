    <text x="25" y="255" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ADVERSARIAL VERDICT</text>
    <text x="25" y="275" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">0 Files Recoverable (0 B)</text>
    <text x="25" y="292" fill="#7F1D1D" font-family="'JetBrains Mono', monospace" font-size="9">Residual entropy = 7.9998 bits/B</text>
