  <!-- FEEDBACK LOOP BACK TO STAGE 1 -->
  <path d="M 815 480 L 815 540 L 185 540 L 185 480" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4" fill="none" />
  <rect x="420" y="525" width="160" height="30" rx="4" fill="#070A10" stroke="#38BDF8" stroke-width="1" />
  <text x="430" y="545" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CYCLE COMPLETE (0 FILES)</text>

  <!-- Footer Info -->
  <text x="50" y="595" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">Architecture Source: docs/diagrams/closed-loop-flow.md • Void Vault Digital Forensics Subsystem • SIH 2026</text>
