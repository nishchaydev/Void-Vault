    <text x="25" y="275" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">CreateFileW(\\\\.\\PhysicalDriveX)</text>
    <text x="25" y="292" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">FILE_FLAG_NO_BUFFERING</text>
