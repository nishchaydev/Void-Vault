    <text x="20" y="135" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Part A (Custodian Statement)</text>
    <text x="20" y="155" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Part B (Examiner Statement)</text>
    <text x="20" y="175" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Offline SPV Air-Gap Valid</text>
    <text x="20" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Court-Admissible Electronic Cert</text>

